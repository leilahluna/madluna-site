<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services &mdash; Madluna</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav>
    <div class="container">
      <a href="/" class="logo">MADLUNA</a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/services/" class="active">Services</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <section class="section">
      <h1 class="section-title">Services</h1>

      <a href="/services/minecraft/" class="card-link">
        <div class="card">
          <h3>Minecraft Server</h3>
          <span id="mc-status" class="status-badge checking" style="margin: 8px 0;">
            <span class="status-dot"></span>
            Checking...
          </span>
          <span style="color: var(--text-secondary); margin: 0 8px;">| Multiplayer server for friends. Live status, player count, and server info.</span>
        
          <span class="arrow">&rarr;</span>
        </div>
      </a>

      <a href="/services/plex/" class="card-link">
        <div class="card">
          <h3>Plex Media Server</h3>
          <span id="plex-status" class="status-badge checking" style="margin: 8px 0;">
            <span class="status-dot"></span>
            Checking...
          </span>
          <span style="color: var(--text-secondary); margin: 0 8px;">|</span>
          <span style="color: var(--text-secondary); font-size: 0.85rem;">Movies, Shows &amp; More</span>
          <p style="margin-top: 8px;">Shared media library. Invite only.</p>
          <span class="arrow">&rarr;</span>
        </div>
      </a>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 Madluna. All rights reserved.</p>
    </div>
  </footer>

  <script>
    async function checkMinecraftStatus() {
      const statusEl = document.getElementById('mc-status');
      try {
        const res = await fetch('https://api.mcsrvstat.us/3/mc.madluna.ca');
        const data = await res.json();
        if (data.online) {
          statusEl.className = 'status-badge online';
          statusEl.innerHTML = '<span class="status-dot"></span> Online';
        } else {
          statusEl.className = 'status-badge offline';
          statusEl.innerHTML = '<span class="status-dot"></span> Offline';
        }
      } catch {
        statusEl.className = 'status-badge offline';
        statusEl.innerHTML = '<span class="status-dot"></span> Unable to check';
      }
    }

    async function checkPlexStatus() {
      const statusEl = document.getElementById('plex-status');
      try {
        const res = await fetch('https://plex-status.merrick-puddephatt.workers.dev');
        const data = await res.json();
        if (data.online) {
          statusEl.className = 'status-badge online';
          statusEl.innerHTML = '<span class="status-dot"></span> Online';
        } else {
          statusEl.className = 'status-badge offline';
          statusEl.innerHTML = '<span class="status-dot"></span> Offline';
        }
      } catch {
        statusEl.className = 'status-badge offline';
        statusEl.innerHTML = '<span class="status-dot"></span> Unable to check';
      }
    }

    checkMinecraftStatus();
    checkPlexStatus();
  </script>
</body>
</html>
