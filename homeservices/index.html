<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="alternate icon" href="/media/favicon.ico">
  <link rel="apple-touch-icon" href="/media/apple-touch-icon.png">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .section {
      padding: 24px 0;
    }
    .section-title {
      margin-bottom: 16px;
    }
    .card {
      padding: 18px;
      margin-bottom: 8px;
    }
    footer {
      padding: 18px 0;
    }
  </style>
</head>
<body>
  <nav>
    <div class="container">
      <a href="/" class="logo">madluna</a>
      <ul class="nav-links">
        <li><a href="/">home</a></li>
        <li><a href="/homeservices/" class="active">home services</a></li>
        <li>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <section class="section">
      <h1 class="section-title">home services</h1>

      <a href="/homeservices/seerr/" class="card-link">
        <div class="card">
          <h3>Overseerr</h3>
          <span id="seerr-status" class="status-badge checking" style="margin: 8px 0;">
            <span class="status-dot"></span>
            checking...
          </span>
          <span style="color: var(--text-secondary); margin: 0 8px;">|</span>
          <span style="color: var(--text-secondary); font-size: 0.85rem;">request movies and shows for the Plex library.</span>
          <span class="arrow">&rarr;</span>
        </div>
      </a>

      <a href="/homeservices/plex/" class="card-link">
        <div class="card">
          <h3>Plex Media Server</h3>
          <span id="plex-status" class="status-badge checking" style="margin: 8px 0;">
            <span class="status-dot"></span>
            checking...
          </span>
          <span style="color: var(--text-secondary); margin: 0 8px;">|</span>
          <span style="color: var(--text-secondary); font-size: 0.85rem;">shared media library. movies, shows &amp; more.</span>
          <span class="arrow">&rarr;</span>
        </div>
      </a>

      <a href="/homeservices/minecraft/" class="card-link">
        <div class="card">
          <h3>Minecraft Server</h3>
          <span id="mc-status" class="status-badge checking" style="margin: 8px 0;">
            <span class="status-dot"></span>
            checking...
          </span>
          <span style="color: var(--text-secondary); margin: 0 8px;">|</span>
          <span style="color: var(--text-secondary); font-size: 0.85rem;">multiplayer server for friends.</span>
          <span class="arrow">&rarr;</span>
        </div>
      </a>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 madluna</p>
    </div>
  </footer>

  <script>
    const WORKER_URL = 'https://plex-status.merrick-puddephatt.workers.dev';

    async function checkStatus(service, elementId) {
      const el = document.getElementById(elementId);
      try {
        const url = service === 'mc'
          ? 'https://api.mcsrvstat.us/3/mc.madluna.ca'
          : `${WORKER_URL}?service=${service}`;
        const res = await fetch(url);
        const data = await res.json();
        const online = service === 'mc' ? data.online : data.online;
        if (online) {
          el.className = 'status-badge online';
          el.innerHTML = '<span class="status-dot"></span> online';
        } else {
          el.className = 'status-badge offline';
          el.innerHTML = '<span class="status-dot"></span> offline';
        }
      } catch {
        el.className = 'status-badge unknown';
        el.innerHTML = '<span class="status-mark">?</span> unable to check';
      }
    }

    checkStatus('seerr', 'seerr-status');
    checkStatus('plex', 'plex-status');
    checkStatus('mc', 'mc-status');
  </script>

</body>
</html>
