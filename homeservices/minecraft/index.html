<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Server &mdash; Madluna</title>
  <link rel="icon" href="/media/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/media/favicon.ico">
  <link rel="apple-touch-icon" href="/media/apple-touch-icon.png">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css?v=2">
</head>
<body>
  <nav>
    <div class="container">
      <a href="/" class="logo">madluna</a>
      <ul class="nav-links">
        <li><a href="/">home</a></li>
        <li><a href="/homeservices/" class="active">home services</a></li>
        <li>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <section class="section">
      <h1 class="section-title">Minecraft Server</h1>

      <div id="server-status" style="margin-bottom: 24px;">
        <span class="status-badge checking">
          <span class="status-dot"></span>
          checking...
        </span>
      </div>

      <div class="server-info">
        <div class="info-row">
          <span class="label">server address</span>
          <span class="value">
            <code style="background: var(--bg-secondary); padding: 4px 10px; border-radius: 4px;">mc.madluna.ca</code>
            <button class="copy-btn" onclick="copyIP()">Copy</button>
          </span>
        </div>
        <div class="info-row">
          <span class="label">type</span>
          <span class="value">multiplayer</span>
        </div>
        <div class="info-row">
          <span class="label">access</span>
          <span class="value">friends only</span>
        </div>
        <div class="info-row">
          <span class="label">version</span>
          <span class="value" id="mc-version">&mdash;</span>
        </div>
        <div class="info-row">
          <span class="label">players online</span>
          <span class="value" id="mc-players">&mdash;</span>
        </div>
        <div class="info-row">
          <span class="label">MOTD</span>
          <span class="value" id="mc-motd">&mdash;</span>
        </div>
      </div>

      <div id="mc-player-list" style="display: none;">
        <h3 style="font-size: 1rem; margin-bottom: 12px; color: var(--text-secondary);">who's online</h3>
        <div id="mc-player-names" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
      </div>

      <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 24px;">
        status refreshes automatically every 60 seconds.
      </p>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 madluna</p>
    </div>
  </footer>

  <script>
    function copyIP() {
      navigator.clipboard.writeText('mc.madluna.ca');
      const btn = document.querySelector('.copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 2000);
    }

    async function checkServerStatus() {
      const statusEl = document.getElementById('server-status');
      const versionEl = document.getElementById('mc-version');
      const playersEl = document.getElementById('mc-players');
      const motdEl = document.getElementById('mc-motd');
      const playerListEl = document.getElementById('mc-player-list');
      const playerNamesEl = document.getElementById('mc-player-names');

      try {
        const res = await fetch('https://api.mcsrvstat.us/3/mc.madluna.ca');
        const data = await res.json();

        if (data.online) {
          statusEl.innerHTML = `
            <span class="status-badge online">
              <span class="status-dot"></span>
              online
            </span>`;

          versionEl.textContent = data.version || '—';
          playersEl.textContent = `${data.players?.online || 0} / ${data.players?.max || '?'}`;

          if (data.motd?.clean?.length) {
            motdEl.textContent = data.motd.clean.join(' ');
          }

          if (data.players?.list?.length) {
            playerListEl.style.display = 'block';
            playerNamesEl.innerHTML = data.players.list.map(p =>
              `<span style="background: var(--bg-secondary); border: 1px solid var(--border); padding: 4px 12px; border-radius: 6px; font-size: 0.9rem;">${p.name}</span>`
            ).join('');
          } else {
            playerListEl.style.display = 'none';
          }
        } else {
          statusEl.innerHTML = `
            <span class="status-badge offline">
              <span class="status-dot"></span>
              offline
            </span>`;
          versionEl.textContent = '—';
          playersEl.textContent = '—';
          motdEl.textContent = '—';
          playerListEl.style.display = 'none';
        }
      } catch (err) {
        statusEl.innerHTML = `
          <span class="status-badge unknown">
            <span class="status-mark">?</span>
            unable to check
          </span>`;
      }
    }

    checkServerStatus();
    setInterval(checkServerStatus, 60000);
  </script>

</body>
</html>
