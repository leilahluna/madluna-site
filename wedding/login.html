<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Photos from Our Day · Merrick &amp; Leilah</title>
  <link rel="icon" href="/media/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#4d3138">
  <script>
    try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark'); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap">
  <style>
    :root {
      --bg-primary: #4d3138; --bg-secondary: #422a31; --text-primary: #e9e7e9; --text-secondary: #D3D2D3;
      --accent: #806021; --on-accent: #f3eee4; --border: #382600; --error: #f0a3a0;
    }
    :root[data-theme="light"] {
      --bg-primary: #F8F8F8; --bg-secondary: #D8D8D8; --text-primary: #474747; --text-secondary: #666666;
      --accent: #99701d; --on-accent: #ffffff; --border: #999999; --error: #b3261e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-primary); color: var(--text-primary);
      line-height: 1.6; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    }
    main { width: 100%; max-width: 380px; text-align: center; }
    .logo { width: 64px; height: auto; display: block; margin: 0 auto 18px; }
    h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; line-height: 1.2; color: var(--text-secondary); margin-bottom: 8px; }
    p.lead { color: var(--text-secondary); font-weight: 300; margin-bottom: 22px; }
    form { background: var(--bg-secondary); border: 2px solid var(--border); border-radius: 12px; padding: 20px 16px; }
    label { display: block; font-weight: 600; font-size: 0.95rem; margin-bottom: 8px; }
    input {
      width: 100%; font: inherit; font-size: 1.15rem; text-align: center; letter-spacing: 1px;
      padding: 12px; border-radius: 10px; border: 2px solid var(--border); background: var(--bg-primary); color: var(--text-primary);
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      margin-top: 12px; width: 100%; font: inherit; font-weight: 600; font-size: 1rem; padding: 14px;
      border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); cursor: pointer;
    }
    .error { color: var(--error); font-size: 0.9rem; margin-bottom: 12px; }
    .help { font-size: 0.8rem; color: var(--text-secondary); margin-top: 16px; }
    .help a { color: inherit; }
  </style>
</head>
<body>
  <main>

    <h1>Your photos from our day</h1>
    <p class="lead">Below, enter the password written under the QR code on your thank you card.</p>
    <form method="post">
      <!--ERROR-->
      <label for="password">Password</label>
      <input id="password" name="password" type="text" required autofocus
             autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
      <button type="submit">Open my photos</button>
    </form>
    <p class="help">Can't find it? <a href="/contact/">Let us know</a> and we'll sort it out.</p>
  </main>

</html>
