<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Guest Uploads · Merrick &amp; Leilah</title>
  <link rel="icon" href="/media/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#4d3138">
  <script>
    try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark'); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap">
  <style>
    :root {
      --bg-primary: #4d3138; --bg-secondary: #422a31; --bg-card: #5a3d44; --text-primary: #e9e7e9; --text-secondary: #D3D2D3;
      --accent: #806021; --on-accent: #f3eee4; --border: #382600; --good: #9fd88a; --warn: #f0c27a; --danger: #f0a3a0;
    }
    :root[data-theme="light"] {
      --bg-primary: #F8F8F8; --bg-secondary: #E6E6E6; --bg-card: #FFFFFF; --text-primary: #474747; --text-secondary: #666666;
      --accent: #99701d; --on-accent: #ffffff; --border: #BBBBBB; --good: #2e7d32; --warn: #9a6200; --danger: #b3261e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.5; min-height: 100vh; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
    header.wrap { padding-top: 28px; padding-bottom: 16px; }
    h1 { font-family: 'Playfair Display', serif; font-size: 1.9rem; color: var(--text-secondary); }
    .summary { color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px; }
    .meter { height: 6px; background: var(--bg-secondary); border-radius: 3px; margin-top: 8px; max-width: 360px; overflow: hidden; }
    .meter span { display: block; height: 100%; background: var(--accent); width: 0; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
    select, .btn, .chip {
      font: inherit; font-size: 0.9rem; border-radius: 10px; padding: 9px 14px; cursor: pointer;
      border: 2px solid var(--border); background: var(--bg-secondary); color: var(--text-primary);
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
    .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .grid { display: grid; grid-template-columns: 1fr; gap: 14px; padding-bottom: 40px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 980px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    .card { background: var(--bg-card); border: 2px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .card.new { border-color: var(--accent); }
    .preview { background: #000; aspect-ratio: 4 / 3; display: grid; place-items: center; }
    .preview img, .preview video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .preview .noprev { color: #aaa; font-size: 0.85rem; padding: 16px; text-align: center; }
    .info { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .who { font-weight: 600; }
    .meta { font-size: 0.8rem; color: var(--text-secondary); word-break: break-word; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1.5px solid currentColor; }
    .badge.new { color: var(--accent); background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .badge.saved { color: var(--good); }
    .badge.unsaved { color: var(--warn); }
    .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 6px; }
    .actions a, .actions button { flex: 1; text-align: center; text-decoration: none; }
    .actions .del { color: var(--danger); }
    .empty { text-align: center; color: var(--text-secondary); padding: 60px 16px; }
    .status { min-height: 1.3em; font-size: 0.85rem; color: var(--text-secondary); margin-top: 10px; }
  </style>
</head>
<body>
  <header class="wrap">
    <h1>Guest uploads</h1>
    <p class="summary" id="summary">Loading…</p>
    <div class="meter" title="Share of Cloudflare's free 10 GB"><span id="meter"></span></div>
    <div class="controls">
      <select id="house" aria-label="Household"><option value="">All households</option></select>
      <button class="chip" id="only-new" type="button" aria-pressed="false">Only new</button>
      <button class="chip" data-kind="" type="button" aria-pressed="true">All</button>
      <button class="chip" data-kind="image" type="button" aria-pressed="false">Photos</button>
      <button class="chip" data-kind="video" type="button" aria-pressed="false">Videos</button>
      <button class="btn" id="refresh" type="button">Refresh</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </header>

  <main class="wrap">
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>Nothing here yet. Photos and videos guests send will show up here.</p>
  </main>

  <script>
  (function () {
    'use strict';
    var FREE = 10 * 1024 * 1024 * 1024;
    var $ = function (id) { return document.getElementById(id); };
    var items = [], filter = { house: '', kind: '', onlyNew: false };

    function size(b) {
      if (b >= 1073741824) return (b / 1073741824).toFixed(2) + ' GB';
      if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
      return Math.max(1, Math.round(b / 1024)) + ' KB';
    }
    function when(iso) {
      return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }
    function fileUrl(it, download) { return 'file?key=' + encodeURIComponent(it.key) + (download ? '&download' : ''); }
    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }
    function post(path, body) {
      return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); });
    }

    function summary() {
      var total = items.reduce(function (s, it) { return s + it.size; }, 0);
      var fresh = items.filter(function (it) { return !it.seen; }).length;
      var unsaved = items.filter(function (it) { return !it.saved; }).length;
      $('summary').textContent = items.length + (items.length === 1 ? ' upload' : ' uploads') +
        (fresh ? ' · ' + fresh + ' new' : '') + (unsaved ? ' · ' + unsaved + ' not on the server yet' : '') +
        ' · ' + size(total) + ' of the free 10 GB';
      $('meter').style.width = Math.min(100, total / FREE * 100) + '%';
    }

    function card(it) {
      var c = el('article', 'card' + (it.seen ? '' : ' new'));
      var pv = el('div', 'preview');
      if (/^video\//.test(it.type)) {
        var v = document.createElement('video');
        v.src = fileUrl(it); v.controls = true; v.preload = 'metadata'; v.playsInline = true;
        pv.appendChild(v);
      } else if (/^image\//.test(it.type)) {
        var img = document.createElement('img');
        img.src = fileUrl(it); img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
        img.onerror = function () { pv.innerHTML = ''; pv.appendChild(el('p', 'noprev', 'This browser can’t preview this photo. Download it to see it.')); };
        pv.appendChild(img);
      } else {
        pv.appendChild(el('p', 'noprev', 'No preview'));
      }
      c.appendChild(pv);

      var info = el('div', 'info');
      info.appendChild(el('p', 'who', it.household || it.slug));
      info.appendChild(el('p', 'meta', when(it.uploaded) + ' · ' + size(it.size) + ' · ' + it.name));
      var badges = el('div', 'badges');
      if (!it.seen) badges.appendChild(el('span', 'badge new', 'New'));
      badges.appendChild(it.saved ? el('span', 'badge saved', 'Saved to server') : el('span', 'badge unsaved', 'Not on the server yet'));
      info.appendChild(badges);

      var actions = el('div', 'actions');
      var dl = el('a', 'btn primary', 'Download');
      dl.href = fileUrl(it, true);
      var del = el('button', 'btn del', 'Delete');
      del.type = 'button';
      del.addEventListener('click', function () {
        var msg = 'Delete "' + it.name + '" from ' + (it.household || it.slug) + '? This can’t be undone.';
        if (!it.saved) msg = 'This one ISN’T saved to your server yet, so deleting it loses it for good.\n\n' + msg;
        if (!confirm(msg)) return;
        del.disabled = true; del.textContent = 'Deleting…';
        post('api/delete', { key: it.key }).then(function () {
          items = items.filter(function (x) { return x !== it; });
          c.remove(); summary(); render();
          $('status').textContent = 'Deleted ' + it.name + '.';
        }).catch(function () {
          del.disabled = false; del.textContent = 'Delete';
          $('status').textContent = 'Couldn’t delete that one. Try again.';
        });
      });
      actions.appendChild(dl); actions.appendChild(del);
      info.appendChild(actions);
      c.appendChild(info);
      return c;
    }

    function render() {
      var shown = items.filter(function (it) {
        return (!filter.house || it.slug === filter.house) &&
               (!filter.kind || it.type.indexOf(filter.kind + '/') === 0) &&
               (!filter.onlyNew || !it.seen);
      });
      var grid = $('grid');
      grid.innerHTML = '';
      shown.forEach(function (it) { grid.appendChild(card(it)); });
      $('empty').hidden = shown.length > 0;
    }

    function load() {
      $('status').textContent = '';
      return fetch('api/items', { cache: 'no-store' }).then(function (r) {
        if (r.status === 401) { location.reload(); throw new Error('logged out'); }
        return r.json();
      }).then(function (data) {
        items = data.items.sort(function (a, b) { return a.uploaded < b.uploaded ? 1 : -1; });   // newest first
        var sel = $('house'), keep = sel.value;
        sel.length = 1;
        data.households.forEach(function (h) {
          var n = items.filter(function (it) { return it.slug === h.slug; }).length;
          var o = el('option', null, h.name + (n ? ' (' + n + ')' : ''));
          o.value = h.slug; sel.appendChild(o);
        });
        sel.value = keep;
        summary(); render();
        // "New" stays on screen for this visit; next time they'll show as seen
        var unseen = items.filter(function (it) { return !it.seen; }).map(function (it) { return it.key; });
        if (unseen.length) post('api/seen', { keys: unseen }).catch(function () {});
      }).catch(function (e) {
        if (e.message !== 'logged out') $('summary').textContent = 'Couldn’t load uploads. Check your connection and tap Refresh.';
      });
    }

    $('house').addEventListener('change', function () { filter.house = this.value; render(); });
    $('only-new').addEventListener('click', function () {
      filter.onlyNew = !filter.onlyNew; this.setAttribute('aria-pressed', String(filter.onlyNew)); render();
    });
    Array.prototype.forEach.call(document.querySelectorAll('.chip[data-kind]'), function (b) {
      b.addEventListener('click', function () {
        filter.kind = b.dataset.kind;
        Array.prototype.forEach.call(document.querySelectorAll('.chip[data-kind]'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
        render();
      });
    });
    $('refresh').addEventListener('click', function () {
      items.forEach(function (it) { it.seen = true; });
      load();
    });
    load();
  })();
  </script>
</body>
</html>
